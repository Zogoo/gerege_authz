---
apiVersion: v1
kind: Service
metadata:
  name: agent-runner
  namespace: apps
  labels: { app: agent-runner }
spec:
  selector: { app: agent-runner }
  ports:
    - name: http
      port: 80
      targetPort: 8080
      appProtocol: http
---
# agent-runner is the agent: it exchanges a user's token for one of its own
# (RFC 8693) and then acts. It is an ordinary mesh workload — the thing that
# makes it an agent is the token it presents downstream, not how it is deployed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runner
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: agent-runner }
  template:
    metadata:
      labels: { app: agent-runner, version: v1 }
      annotations:
        traffic.sidecar.istio.io/excludeInboundPorts: "8081"
    spec:
      serviceAccountName: agent-runner
      containers:
        - name: app
          image: gerege/idp-mvp:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/agent-runner"]
          env:
            # The exchange is a back-channel call, so it uses the in-cluster
            # address; the issuer the token carries is still the browser-facing
            # one (mvp_docs/06 hazard 4).
            - name: TOKEN_URL
              value: http://keycloak.id.svc.cluster.local:8080/realms/gerege/protocol/openid-connect/token
            - name: AGENT_CLIENT_ID
              value: assistant-agent
            - name: AGENT_CLIENT_SECRET
              value: assistant-agent-secret
            - name: DEVICE_SERVICE_URL
              value: http://device-service.apps.svc.cluster.local
            - name: PROFILE_SERVICE_URL
              value: http://profile-service.apps.svc.cluster.local
            - name: HOME_ID
              value: alice-home
          ports:
            - { name: http, containerPort: 8080 }
            - { name: health, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
---
# The account console lives in the identity plane, not with the demo apps: it is
# the only component permitted to write consent relationships, and keeping that
# write path in its own process with its own identity is what lets ext-authz
# stay read-only on SpiceDB (mvp_docs/04 §1).
apiVersion: v1
kind: ServiceAccount
metadata: { name: account-app, namespace: id }
---
apiVersion: v1
kind: Service
metadata:
  name: account-app
  namespace: id
  labels: { app: account-app }
spec:
  selector: { app: account-app }
  ports:
    - name: http
      port: 80
      targetPort: 8080
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-app
  namespace: id
spec:
  replicas: 1
  selector:
    matchLabels: { app: account-app }
  template:
    metadata:
      labels: { app: account-app, version: v1 }
      annotations:
        traffic.sidecar.istio.io/excludeInboundPorts: "8081"
    spec:
      serviceAccountName: account-app
      containers:
        - name: app
          image: gerege/idp-mvp:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/account-app"]
          env:
            - name: SPICEDB_ENDPOINT
              value: spicedb.id.svc.cluster.local:50051
            - name: SPICEDB_INSECURE
              value: "true"
            - name: SPICEDB_TOKEN
              valueFrom:
                secretKeyRef: { name: spicedb-preshared-key, key: key }
            - name: PROFILE_APP_URL
              value: http://profile.local.test
            - name: SMARTHOME_URL
              value: http://smarthome.local.test
          ports:
            - { name: http, containerPort: 8080 }
            - { name: health, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
