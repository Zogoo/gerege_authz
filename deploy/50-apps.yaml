# The four demonstration workloads.
#
# Every one of them has its own ServiceAccount (M-010). This is not tidiness:
# Istio derives each workload's SPIFFE identity from its ServiceAccount, and
# that identity is what ext-authz reads from `source.principal` to decide
# whether a caller is registered to serve an application. Share a
# ServiceAccount between two workloads and they become one identity — Scenario
# 3c and assertion A10 would then pass for the wrong reason, which is worse
# than failing.
#
# None of these services contains authorization logic. Look for it: there is
# none. That is the property the architecture buys.
apiVersion: v1
kind: ServiceAccount
metadata: { name: profile-app, namespace: apps }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: profile-service, namespace: apps }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: smarthome-service, namespace: apps }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: device-service, namespace: apps }
---
# The agent gets its own ServiceAccount like everything else, and for the same
# reason: its SPIFFE identity is what lets device-service tell an agent's call
# apart from smarthome-service's. An agent that shared an identity with the
# service that invoked it would be invisible at the very hop that has to see it.
apiVersion: v1
kind: ServiceAccount
metadata: { name: agent-runner, namespace: apps }
---
apiVersion: v1
kind: Service
metadata:
  name: profile-app
  namespace: apps
  labels: { app: profile-app }
spec:
  selector: { app: profile-app }
  ports:
    - name: http
      port: 80
      targetPort: 8080
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-app
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: profile-app }
  template:
    metadata:
      labels: { app: profile-app, version: v1 }
      annotations:
        # Probes originate on the node and cannot present mesh credentials, so
        # the health port is excluded from interception (mvp_docs/02 §5). It
        # serves liveness and nothing else; anything else there would be an
        # authorization bypass.
        traffic.sidecar.istio.io/excludeInboundPorts: "8081"
    spec:
      serviceAccountName: profile-app
      containers:
        - name: app
          image: gerege/idp-mvp:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/profile-app"]
          env:
            - name: PROFILE_SERVICE_URL
              value: http://profile-service.apps.svc.cluster.local
            - name: SMARTHOME_URL
              value: http://smarthome.local.test
            - name: ACCOUNT_URL
              value: http://account.local.test
          ports:
            - { name: http, containerPort: 8080 }
            - { name: health, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: apps
  labels: { app: profile-service }
spec:
  selector: { app: profile-service }
  ports:
    - name: http
      port: 80
      targetPort: 8080
