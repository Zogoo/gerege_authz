          imagePullPolicy: IfNotPresent
          command: ["/app/smarthome-service"]
          env:
            - name: DEVICE_SERVICE_URL
              value: http://device-service.apps.svc.cluster.local
            - name: PROFILE_SERVICE_URL
              value: http://profile-service.apps.svc.cluster.local
            - name: ACCOUNT_URL
              value: http://account.local.test
            - name: AGENT_RUNNER_URL
              value: http://agent-runner.apps.svc.cluster.local
            - name: PROFILE_APP_URL
              value: http://profile.local.test
            - name: HOME_ID
              value: alice-home
          ports:
